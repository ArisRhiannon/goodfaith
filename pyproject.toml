[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goodfaith"
version = "0.2.0"
description = "Trust-first Discord automoderation engine that would rather miss a spammer than mute a regular — zero false positives by design."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aris Rhiannon" }]
keywords = [
  "discord", "moderation", "automod", "anti-spam", "anti-raid",
  "false-positive", "trust", "reputation", "simhash",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
discord = ["discord.py>=2.3"]

[project.urls]
Homepage = "https://github.com/ArisRhiannon/goodfaith"
Repository = "https://github.com/ArisRhiannon/goodfaith"
Issues = "https://github.com/ArisRhiannon/goodfaith/issues"

[project.scripts]
goodfaith = "goodfaith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["goodfaith"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
